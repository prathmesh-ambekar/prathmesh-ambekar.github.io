<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Prathmesh Ambekar</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #1f2024; --surface2: #2e2f35; --primary: #78e35b; --text: #f2f2f2; --muted: #9a9ca5; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1rem; overflow: hidden; position: relative;
    }
    body::before, body::after {
      content: ''; position: absolute; border-radius: 50%; background: var(--primary);
    }
    body::before { width: 140px; height: 140px; top: -80px; left: -80px; }
    body::after { width: 230px; height: 230px; bottom: -110px; right: -110px; }
    .label { color: var(--primary); font-weight: 600; letter-spacing: 4px; font-size: .9rem; }
    h1 { font-size: clamp(2.6rem, 7vw, 5rem); font-weight: 600; line-height: 1.1; margin: 1rem 0; }
    p { color: var(--muted); max-width: 460px; line-height: 1.8; }
    a {
      margin-top: 2.2rem; display: inline-block;
      padding: .8rem 2rem; border-radius: 3px;
      background: var(--primary); color: var(--bg);
      font-weight: 700; font-size: .85rem; letter-spacing: 1px; text-transform: uppercase;
      text-decoration: none; transition: transform .3s;
    }
    a:hover { transform: translateY(-4px); }
  </style>
</head>
<body>
  <p class="label">BLOG</p>
  <h1>Coming Soon</h1>
  <p>I'm writing about backend engineering, Generative AI, cloud and the things I build. Check back soon.</p>
  <a href="index.html">← Back to Portfolio</a>
</body>
</html>
